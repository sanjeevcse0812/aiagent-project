<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fun Learning - Class 1 Puzzles</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --fg: #eaeaea;
      --accent: #00d4aa;
      --accent-dim: #00d4aa33;
      --danger: #ff4757;
      --success: #2ed573;
      --warning: #ffa502;
      --card: #16213e;
      --border: #2a2a4a;
      --math: #54a0ff;
      --english: #ff6b9d;
      --science: #00d4aa;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f7fa;
        --fg: #1a1a2e;
        --accent: #00a888;
        --accent-dim: #00a88822;
        --danger: #d63031;
        --success: #20bf6b;
        --warning: #e17055;
        --card: #ffffff;
        --border: #d0d6e0;
        --math: #2e86de;
        --english: #ee5a6f;
        --science: #00a888;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      user-select: none;
    }

    h1 {
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .subtitle {
      font-size: 0.9rem;
      opacity: 0.7;
      margin-bottom: 1.25rem;
      text-align: center;
    }

    /* Top bar shown during a quiz */
    .top-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 0.75rem;
    }

    .top-bar .back-btn {
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--border);
      padding: 0.5rem 0.9rem;
      font-size: 0.9rem;
    }

    .progress-pill {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
    }

    .progress-pill .bar {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      background: var(--border);
      overflow: hidden;
    }

    .progress-pill .bar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.4s ease;
    }

    .score-pill {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .score-pill strong {
      color: var(--accent);
    }

    /* Subject selection screen */
    .screen {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .screen[hidden] {
      display: none;
    }

    .subject-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.9rem;
    }

    .subject-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 1.1rem 1.2rem;
      cursor: pointer;
      text-align: left;
      color: var(--fg);
      font-family: inherit;
      transition: transform 0.12s, box-shadow 0.2s, border-color 0.2s;
    }

    .subject-card:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .subject-card:active {
      transform: scale(0.98);
    }

    .subject-card .emoji {
      font-size: 2.4rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .subject-card .meta {
      flex: 1;
    }

    .subject-card .meta .name {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 0.15rem;
    }

    .subject-card .meta .desc {
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .subject-card .stars {
      font-size: 0.95rem;
      letter-spacing: 1px;
      color: var(--warning);
      flex-shrink: 0;
      text-align: right;
    }

    .subject-card .stars .best {
      display: block;
      font-size: 0.72rem;
      color: var(--fg);
      opacity: 0.6;
      letter-spacing: 0;
      margin-top: 0.15rem;
    }

    /* Quiz screen */
    .question-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 1.5rem 1.25rem;
      text-align: center;
    }

    .question-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1rem;
      color: var(--bg);
    }

    .question-tag.math { background: var(--math); }
    .question-tag.english { background: var(--english); }
    .question-tag.science { background: var(--science); }

    .question-text {
      font-size: clamp(1.5rem, 7vw, 2rem);
      font-weight: 800;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    .question-emoji {
      font-size: 3.5rem;
      margin: 0.5rem 0;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1.25rem;
    }

    .choice {
      background: var(--bg);
      color: var(--fg);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 1rem 0.5rem;
      font-size: 1.4rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, border-color 0.2s, background 0.2s;
    }

    .choice:hover {
      border-color: var(--accent);
    }

    .choice:active {
      transform: scale(0.96);
    }

    .choice.correct {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }

    .choice.wrong {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    .choice.disabled {
      pointer-events: none;
      opacity: 0.55;
    }

    .feedback {
      margin-top: 1rem;
      font-size: 1.15rem;
      font-weight: 700;
      min-height: 1.6rem;
    }

    .feedback.good { color: var(--success); }
    .feedback.bad { color: var(--danger); }

    .next-btn {
      margin-top: 1rem;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 14px;
      padding: 0.9rem 2rem;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
      transition: transform 0.1s, box-shadow 0.2s;
    }

    .next-btn:hover { box-shadow: 0 6px 18px var(--accent-dim); }
    .next-btn:active { transform: scale(0.98); }
    .next-btn[hidden] { display: none; }

    /* Result screen */
    .result-card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .result-card .big-emoji {
      font-size: 4rem;
      margin-bottom: 0.5rem;
    }

    .result-card h2 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .result-card .score-display {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--accent);
      margin: 0.5rem 0;
    }

    .result-card .stars-row {
      font-size: 1.8rem;
      letter-spacing: 4px;
      margin: 0.5rem 0 1rem;
    }

    .result-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .result-actions button {
      flex: 1;
      padding: 0.9rem 1rem;
      font-size: 1rem;
    }

    .btn-secondary {
      background: var(--card);
      color: var(--fg);
      border: 2px solid var(--border);
      border-radius: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
    }

    .btn-secondary:hover { border-color: var(--accent); }
    .btn-secondary:active { transform: scale(0.98); }

    .reset-link {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      opacity: 0.6;
      text-align: center;
      cursor: pointer;
      text-decoration: underline;
      background: none;
      border: none;
      color: inherit;
      font-family: inherit;
    }

    @media (min-width: 480px) {
      .subject-grid {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>🎓 Fun Learning</h1>
  <p class="subtitle">Class 1 Puzzles — pick a subject!</p>

  <!-- Subject selection screen -->
  <section class="screen" id="homeScreen">
    <div class="subject-grid" id="subjectGrid"></div>
    <button class="reset-link" id="resetProgress">Reset all progress</button>
  </section>

  <!-- Quiz screen -->
  <section class="screen" id="quizScreen" hidden>
    <div class="top-bar">
      <button class="back-btn" id="backBtn">← Home</button>
      <div class="progress-pill">
        <span id="qCounter">1/10</span>
        <div class="bar"><span id="qProgress"></span></div>
      </div>
    </div>
    <div class="score-pill">Score: <strong id="liveScore">0</strong></div>

    <div class="question-card">
      <span class="question-tag" id="qTag">Math</span>
      <div class="question-emoji" id="qEmoji"></div>
      <div class="question-text" id="qText">Question</div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" hidden>Next →</button>
    </div>
  </section>

  <!-- Result screen -->
  <section class="screen" id="resultScreen" hidden>
    <div class="result-card">
      <div class="big-emoji" id="resultEmoji">🎉</div>
      <h2 id="resultTitle">Great Job!</h2>
      <div class="score-display" id="resultScore">10/10</div>
      <div class="stars-row" id="resultStars">⭐⭐⭐</div>
      <p id="resultMessage">You are a star!</p>
      <div class="result-actions">
        <button class="btn-secondary" id="resultHome">Home</button>
        <button class="next-btn" id="resultRetry" style="flex:1;">Play Again ↻</button>
      </div>
    </div>
  </section>

  <script>
    // ---------- Question banks (Class 1 level) ----------
    const SUBJECTS = {
      math: {
        name: 'Math',
        emoji: '🔢',
        desc: 'Counting & sums',
        color: 'math',
        questions: [
          { q: '2 + 3 = ?', a: '5',   choices: ['4', '5', '6', '7'] },
          { q: '4 + 1 = ?', a: '5',   choices: ['5', '6', '3', '4'] },
          { q: '6 - 2 = ?', a: '4',   choices: ['4', '3', '5', '2'] },
          { q: '7 + 2 = ?', a: '9',   choices: ['8', '9', '10', '7'] },
          { q: '10 - 4 = ?', a: '6',  choices: ['5', '6', '7', '4'] },
          { q: '1 + 8 = ?', a: '9',   choices: ['9', '8', '7', '10'] },
          { q: '5 + 5 = ?', a: '10',  choices: ['10', '9', '11', '8'] },
          { q: '9 - 3 = ?', a: '6',  choices: ['6', '5', '7', '3'] },
          { q: '3 + 4 = ?', a: '7',   choices: ['7', '6', '8', '5'] },
          { q: '8 - 1 = ?', a: '7',   choices: ['7', '8', '6', '9'] },
          { q: '2 + 2 = ?', a: '4',   choices: ['4', '3', '5', '2'] },
          { q: '10 - 5 = ?', a: '5',  choices: ['5', '4', '6', '3'] },
        ]
      },
      english: {
        name: 'English',
        emoji: '🔤',
        desc: 'Letters & words',
        color: 'english',
        questions: [
          { q: 'Which letter comes after A?', a: 'B', choices: ['C', 'B', 'D', 'E'] },
          { q: 'Which letter comes after D?', a: 'E', choices: ['F', 'C', 'E', 'G'] },
          { q: 'First letter of APPLE?', a: 'A', choices: ['P', 'A', 'E', 'O'] },
          { q: 'First letter of BALL?', a: 'B', choices: ['B', 'D', 'P', 'L'] },
          { q: 'Which is a VOWEL?', a: 'O', choices: ['B', 'O', 'K', 'T'] },
          { q: 'Which is a VOWEL?', a: 'E', choices: ['E', 'G', 'N', 'R'] },
          { q: 'How many letters in CAT?', a: '3', choices: ['2', '3', '4', '5'] },
          { q: 'Which word means a baby dog?', a: 'Pup', choices: ['Pup', 'Cub', 'Calf', 'Kid'] },
          { q: 'Which word RHYMES with CAT?', a: 'Hat', choices: ['Dog', 'Hat', 'Sun', 'Book'] },
          { q: 'Which word RHYMES with SUN?', a: 'Run', choices: ['Tree', 'Run', 'Moon', 'Car'] },
          { q: 'Last letter of DOG?', a: 'G', choices: ['D', 'O', 'G', 'S'] },
          { q: 'Which is a CAPITAL letter?', a: 'Z', choices: ['z', 'Z', 'q', 'a'] },
        ]
      },
      science: {
        name: 'Science',
        emoji: '🔬',
        desc: 'Animals & nature',
        color: 'science',
        questions: [
          { q: 'Which animal says Moo?', a: 'Cow', emoji: '🐄', choices: ['Dog', 'Cow', 'Cat', 'Duck'] },
          { q: 'Which animal says Meow?', a: 'Cat', emoji: '🐱', choices: ['Cat', 'Lion', 'Dog', 'Rat'] },
          { q: 'What color is the sky on a clear day?', a: 'Blue', emoji: '🌌', choices: ['Green', 'Blue', 'Red', 'Black'] },
          { q: 'What do plants need to grow?', a: 'Water', emoji: '🌱', choices: ['Candy', 'Water', 'Toys', 'Juice'] },
          { q: 'Which animal lives in water?', a: 'Fish', emoji: '🐟', choices: ['Cow', 'Fish', 'Tiger', 'Hen'] },
          { q: 'What do we see with?', a: 'Eyes', emoji: '👀', choices: ['Ears', 'Eyes', 'Nose', 'Mouth'] },
          { q: 'Which fruit is yellow?', a: 'Banana', emoji: '🍌', choices: ['Apple', 'Banana', 'Grapes', 'Cherry'] },
          { q: 'How many legs does a spider have?', a: '8', emoji: '🕷️', choices: ['6', '8', '4', '10'] },
          { q: 'Which is the hottest season?', a: 'Summer', emoji: '☀️', choices: ['Winter', 'Summer', 'Rainy', 'Spring'] },
          { q: 'What do bees make?', a: 'Honey', emoji: '🐝', choices: ['Milk', 'Honey', 'Bread', 'Juice'] },
          { q: 'Which animal is the King of the Jungle?', a: 'Lion', emoji: '🦁', choices: ['Tiger', 'Lion', 'Bear', 'Wolf'] },
          { q: 'What gives us light during the day?', a: 'Sun', emoji: '☀️', choices: ['Moon', 'Sun', 'Stars', 'Lamp'] },
        ]
      }
    };

    const SUBJECT_KEYS = Object.keys(SUBJECTS);
    const QUESTIONS_PER_ROUND = 10;

    // ---------- Progress (persisted in localStorage) ----------
    const STORAGE_KEY = 'class1QuizProgress';

    function loadProgress() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    function saveProgress(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (e) {
        /* ignore quota errors */
      }
    }

    let progress = loadProgress();

    function getSubjectProgress(key) {
      if (!progress[key]) {
        progress[key] = { best: 0, played: 0, totalStars: 0 };
      }
      return progress[key];
    }

    function scoreToStars(score, total) {
      const pct = score / total;
      if (pct >= 0.9) return 3;
      if (pct >= 0.6) return 2;
      if (pct >= 0.4) return 1;
      return 0;
    }

    // ---------- DOM ----------
    const homeScreen = document.getElementById('homeScreen');
    const quizScreen = document.getElementById('quizScreen');
    const resultScreen = document.getElementById('resultScreen');
    const subjectGrid = document.getElementById('subjectGrid');
    const qTag = document.getElementById('qTag');
    const qText = document.getElementById('qText');
    const qEmoji = document.getElementById('qEmoji');
    const qCounter = document.getElementById('qCounter');
    const qProgress = document.getElementById('qProgress');
    const liveScore = document.getElementById('liveScore');
    const choicesEl = document.getElementById('choices');
    const feedback = document.getElementById('feedback');
    const nextBtn = document.getElementById('nextBtn');
    const backBtn = document.getElementById('backBtn');
    const resetProgress = document.getElementById('resetProgress');
    const resultEmoji = document.getElementById('resultEmoji');
    const resultTitle = document.getElementById('resultTitle');
    const resultScore = document.getElementById('resultScore');
    const resultStars = document.getElementById('resultStars');
    const resultMessage = document.getElementById('resultMessage');
    const resultHome = document.getElementById('resultHome');
    const resultRetry = document.getElementById('resultRetry');

    // ---------- Home screen ----------
    function renderHome() {
      subjectGrid.innerHTML = '';
      SUBJECT_KEYS.forEach(key => {
        const s = SUBJECTS[key];
        const p = getSubjectProgress(key);
        const stars = scoreToStars(p.best, QUESTIONS_PER_ROUND);
        const starStr = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);

        const card = document.createElement('button');
        card.className = 'subject-card';
        card.style.borderLeft = `6px solid var(--${s.color})`;
        card.innerHTML = `
          <span class="emoji">${s.emoji}</span>
          <span class="meta">
            <span class="name">${s.name}</span>
            <span class="desc">${s.desc}</span>
          </span>
          <span class="stars">${starStr}
            <span class="best">Best: ${p.best}/${QUESTIONS_PER_ROUND}</span>
          </span>
        `;
        card.addEventListener('click', () => startQuiz(key));
        subjectGrid.appendChild(card);
      });
    }

    // ---------- Quiz state ----------
    let currentSubject = null;
    let roundQuestions = [];
    let qIndex = 0;
    let score = 0;
    let answered = false;

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startQuiz(key) {
      currentSubject = key;
      const pool = SUBJECTS[key].questions;
      // Pick QUESTIONS_PER_ROUND random questions (or all if fewer)
      roundQuestions = shuffle(pool).slice(0, Math.min(QUESTIONS_PER_ROUND, pool.length));
      qIndex = 0;
      score = 0;
      liveScore.textContent = '0';
      homeScreen.hidden = true;
      resultScreen.hidden = true;
      quizScreen.hidden = false;
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      const q = roundQuestions[qIndex];
      const s = SUBJECTS[currentSubject];

      qTag.textContent = s.name;
      qTag.className = 'question-tag ' + s.color;
      qText.textContent = q.q;
      qEmoji.textContent = q.emoji || '';
      qEmoji.hidden = !q.emoji;
      qCounter.textContent = `${qIndex + 1}/${roundQuestions.length}`;
      qProgress.style.width = `${(qIndex / roundQuestions.length) * 100}%`;
      feedback.textContent = '';
      feedback.className = 'feedback';
      nextBtn.hidden = true;

      // Shuffle choices each render
      const shuffledChoices = shuffle(q.choices);
      choicesEl.innerHTML = '';
      shuffledChoices.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.textContent = c;
        btn.addEventListener('click', () => handleAnswer(c, q.a, btn));
        choicesEl.appendChild(btn);
      });
    }

    function handleAnswer(picked, correct, btn) {
      if (answered) return;
      answered = true;

      const allChoices = choicesEl.querySelectorAll('.choice');
      allChoices.forEach(c => {
        c.classList.add('disabled');
        if (c.textContent === correct) c.classList.add('correct');
      });

      if (picked === correct) {
        score++;
        liveScore.textContent = score;
        feedback.textContent = pickPraise();
        feedback.className = 'feedback good';
      } else {
        btn.classList.add('wrong');
        feedback.textContent = `Oops! Answer: ${correct}`;
        feedback.className = 'feedback bad';
      }

      qProgress.style.width = `${((qIndex + 1) / roundQuestions.length) * 100}%`;
      nextBtn.hidden = false;
      nextBtn.textContent = (qIndex + 1 >= roundQuestions.length) ? 'See Result →' : 'Next →';
    }

    const PRAISES = ['Great!', 'Well done!', 'Correct!', 'Awesome!', 'You got it!', 'Brilliant!'];
    function pickPraise() {
      return PRAISES[Math.floor(Math.random() * PRAISES.length)];
    }

    function nextQuestion() {
      qIndex++;
      if (qIndex >= roundQuestions.length) {
        finishQuiz();
      } else {
        showQuestion();
      }
    }

    function finishQuiz() {
      const total = roundQuestions.length;
      const stars = scoreToStars(score, total);
      const p = getSubjectProgress(currentSubject);

      p.played += 1;
      if (score > p.best) p.best = score;
      p.totalStars = stars;
      saveProgress(progress);

      resultScore.textContent = `${score}/${total}`;
      resultStars.textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);

      if (stars === 3) {
        resultEmoji.textContent = '🏆';
        resultTitle.textContent = 'Perfect!';
        resultMessage.textContent = 'You are a superstar!';
      } else if (stars === 2) {
        resultEmoji.textContent = '🎉';
        resultTitle.textContent = 'Great Job!';
        resultMessage.textContent = 'Almost perfect — try again!';
      } else if (stars === 1) {
        resultEmoji.textContent = '👍';
        resultTitle.textContent = 'Good Try!';
        resultMessage.textContent = 'Keep practicing, you will get it!';
      } else {
        resultEmoji.textContent = '💪';
        resultTitle.textContent = 'Try Again!';
        resultMessage.textContent = 'Practice makes you better!';
      }

      quizScreen.hidden = true;
      resultScreen.hidden = false;
    }

    function goHome() {
      quizScreen.hidden = true;
      resultScreen.hidden = true;
      homeScreen.hidden = false;
      renderHome();
    }

    // ---------- Event listeners ----------
    nextBtn.addEventListener('click', nextQuestion);
    backBtn.addEventListener('click', goHome);
    resultHome.addEventListener('click', goHome);
    resultRetry.addEventListener('click', () => startQuiz(currentSubject));

    resetProgress.addEventListener('click', () => {
      if (confirm('Reset all scores and stars? This cannot be undone.')) {
        progress = {};
        saveProgress(progress);
        renderHome();
      }
    });

    // Initialize
    renderHome();
  </script>
</body>
</html>
