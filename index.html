<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class 1 Fun Quiz: Math, English & Science</title>
  <style>
    :root {
      --bg: #fdf6e2;
      --card: #ffffff;
      --primary: #ff6b6b;
      --primary-hover: #fa5252;
      --math-color: #4dabf7;
      --eng-color: #ffd43b;
      --sci-color: #69db7c;
      --text: #2d3748;
      --muted: #718096;
      --correct: #40c057;
      --wrong: #fa5252;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .quiz-card {
      background: var(--card);
      border-radius: 24px;
      padding: 28px;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
      border: 4px solid #f1e3c8;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: 1.8rem;
      color: #e8590c;
      margin-bottom: 8px;
    }

    p.tagline {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 20px;
    }

    /* Selection Grids */
    .section-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #495057;
      margin: 14px 0 10px;
    }

    .pill-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .pill-btn {
      border: 3px solid transparent;
      padding: 10px 18px;
      font-size: 1rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: bold;
      background: #f1f3f5;
      color: #495057;
      transition: all 0.2s ease;
    }

    .pill-btn:hover {
      transform: scale(1.05);
    }

    .pill-btn.selected {
      border-color: #2b8a3e;
      background: #d3f9d8;
      color: #2b8a3e;
    }

    .pill-btn[data-subject="math"].selected {
      background: #e7f5ff;
      border-color: #1971c2;
      color: #1971c2;
    }

    .pill-btn[data-subject="english"].selected {
      background: #fff9db;
      border-color: #f08c00;
      color: #e67700;
    }

    .pill-btn[data-subject="science"].selected {
      background: #ebfbee;
      border-color: #2f9e44;
      color: #2b8a3e;
    }

    /* Start Button */
    .btn-start {
      background: var(--primary);
      color: #fff;
      font-size: 1.2rem;
      border: none;
      border-radius: 16px;
      padding: 14px 28px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
      transition: 0.2s;
    }

    .btn-start:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    /* Quiz Header */
    .quiz-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--muted);
    }

    .badge {
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      background: #e9ecef;
      color: #495057;
    }

    /* Question & Options */
    .question-box {
      font-size: 1.3rem;
      font-weight: bold;
      color: #212529;
      margin: 20px 0;
      line-height: 1.4;
      min-height: 60px;
    }

    .options-list {
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: #f8f9fa;
      border: 3px solid #dee2e6;
      padding: 14px 20px;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #343a40;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      background: #f1f3f5;
      border-color: #adb5bd;
    }

    .option-btn.correct {
      background: #d3f9d8 !important;
      border-color: var(--correct) !important;
      color: #2b8a3e !important;
    }

    .option-btn.incorrect {
      background: #ffe3e3 !important;
      border-color: var(--wrong) !important;
      color: #c92a2a !important;
    }

    /* Feedback Banner */
    .feedback {
      font-size: 1.1rem;
      font-weight: bold;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .feedback.correct {
      background: #ebfbee;
      color: #2b8a3e;
    }

    .feedback.incorrect {
      background: #fff5f5;
      color: #c92a2a;
    }

    .btn-next {
      background: #4dabf7;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
    }

    .btn-next:hover {
      background: #339af0;
    }

    /* Result Screen */
    .score-banner {
      font-size: 3rem;
      font-weight: bold;
      color: #e8590c;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    
    <!-- Step 1: Subject & Difficulty Selection -->
    <div id="setup-screen">
      <h1>⭐ Class 1 Quiz ⭐</h1>
      <p class="tagline">Pick your favorite subject and level to play!</p>

      <div class="section-title">1. Choose Subject</div>
      <div class="pill-group" id="subject-group">
        <button class="pill-btn selected" data-subject="math" onclick="setSubject('math')">🔢 Math</button>
        <button class="pill-btn" data-subject="english" onclick="setSubject('english')">📖 English</button>
        <button class="pill-btn" data-subject="science" onclick="setSubject('science')">🌱 Science</button>
      </div>

      <div class="section-title">2. Choose Difficulty</div>
      <div class="pill-group" id="difficulty-group">
        <button class="pill-btn selected" data-level="easy" onclick="setLevel('easy')">🟢 Easy</button>
        <button class="pill-btn" data-level="medium" onclick="setLevel('medium')">🟡 Medium</button>
        <button class="pill-btn" data-level="hard" onclick="setLevel('hard')">🔴 Hard</button>
      </div>

      <button class="btn-start" onclick="startQuiz()">Start Playing 🚀</button>
    </div>

    <!-- Step 2: Active Quiz -->
    <div id="quiz-screen" class="hidden">
      <div class="quiz-bar">
        <span id="subject-badge" class="badge">Math</span>
        <span id="q-counter">Question 1/5</span>
        <span id="score-counter">Score: 0 ⭐</span>
      </div>

      <div id="question-text" class="question-box">Loading...</div>
      <div id="options-box" class="options-list"></div>

      <div id="feedback" class="feedback hidden"></div>
      <button id="next-btn" class="btn-next hidden" onclick="nextQuestion()">Next Question ➡️</button>
    </div>

    <!-- Step 3: Result -->
    <div id="result-screen" class="hidden">
      <h1>🎉 Great Job! 🎉</h1>
      <p class="tagline">You finished the quiz!</p>
      <div id="final-score" class="score-banner">0 / 5</div>
      <p id="star-message" style="margin-bottom: 24px; font-weight: bold;"></p>
      
      <button class="btn-start" onclick="startQuiz()">Play Again 🔄</button>
      <button class="pill-btn" style="margin-top: 12px; width: 100%;" onclick="goHome()">Choose Another Subject 🏠</button>
    </div>

  </div>

  <script>
    // Class 1 Question Bank: Categorized by Subject & Difficulty
    const questionsDatabase = {
      math: {
        easy: [
          { q: "What is 2 + 3?", options: ["5", "4", "6", "7"], a: "5" },
          { q: "What number comes after 9?", options: ["10", "8", "11", "7"], a: "10" },
          { q: "Which shape has 3 sides?", options: ["Triangle", "Square", "Circle", "Rectangle"], a: "Triangle" },
          { q: "What is 5 - 1?", options: ["4", "3", "6", "2"], a: "4" },
          { q: "Which number is smaller: 2 or 8?", options: ["2", "8"], a: "2" },
          { q: "How many fingers do you have on one hand?", options: ["5", "4", "10", "6"], a: "5" },
          { q: "What is 1 + 1?", options: ["2", "3", "0", "1"], a: "2" }
        ],
        medium: [
          { q: "What is 7 + 6?", options: ["13", "12", "14", "11"], a: "13" },
          { q: "What is 10 - 4?", options: ["6", "5", "7", "4"], a: "6" },
          { q: "Which number is the BIGGEST?", options: ["19", "12", "9", "15"], a: "19" },
          { q: "Count in 2s: 2, 4, 6, __?", options: ["8", "7", "9", "10"], a: "8" },
          { q: "What number comes just before 20?", options: ["19", "18", "21", "17"], a: "19" },
          { q: "What is 8 + 0?", options: ["8", "0", "9", "80"], a: "8" },
          { q: "How many corners does a square have?", options: ["4", "3", "5", "0"], a: "4" }
        ],
        hard: [
          { q: "You have 5 apples. You eat 2, then pick 4 more. How many now?", options: ["7", "6", "8", "5"], a: "7" },
          { q: "What is 15 - 7?", options: ["8", "9", "7", "6"], a: "8" },
          { q: "Which is an EVEN number?", options: ["8", "7", "5", "3"], a: "8" },
          { q: "What is 10 + 10?", options: ["20", "100", "15", "18"], a: "20" },
          { q: "Find the missing number: 5, 10, 15, __?", options: ["20", "25", "16", "18"], a: "20" },
          { q: "A clock has two hands. The short hand tells the...?", options: ["Hour", "Minute", "Second", "Day"], a: "Hour" }
        ]
      },

      english: {
        easy: [
          { q: "Which letter comes after 'C'?", options: ["D", "E", "B", "A"], a: "D" },
          { q: "What is the first letter of 'APPLE'?", options: ["A", "P", "L", "E"], a: "A" },
          { q: "Which of these is a VOWEL?", options: ["E", "B", "T", "M"], a: "E" },
          { q: "Which word rhymes with 'CAT'?", options: ["BAT", "DOG", "SUN", "PIG"], a: "BAT" },
          { q: "What is the plural of 'Cat' (more than one)?", options: ["Cats", "Cates", "Caties", "Cat"], a: "Cats" },
          { q: "Which letter is a CAPITAL letter?", options: ["M", "m", "b", "d"], a: "M" }
        ],
        medium: [
          { q: "What is the opposite of 'HOT'?", options: ["Cold", "Warm", "Dry", "Soft"], a: "Cold" },
          { q: "Choose the correct word: 'The sky is ___'", options: ["blue", "blew", "blow", "blues"], a: "blue" },
          { q: "Which word is a naming word (Noun)?", options: ["Dog", "Run", "Quickly", "Yellow"], a: "Dog" },
          { q: "Fill in the vowel: B _ D (place to sleep)", options: ["E", "A", "O", "U"], a: "E" },
          { q: "What is the opposite of 'BIG'?", options: ["Small", "Huge", "Tall", "Heavy"], a: "Small" },
          { q: "Which of these is an action word (Verb)?", options: ["Jump", "Chair", "Table", "Tree"], a: "Jump" }
        ],
        hard: [
          { q: "Choose the correct sentence:", options: ["She has a red ball.", "She have a red ball.", "She having a ball.", "Her has red ball."], a: "She has a red ball." },
          { q: "What is the plural of 'BOX'?", options: ["Boxes", "Boxs", "Boxen", "Boxies"], a: "Boxes" },
          { q: "Which word starts with a blend sound 'BL'?", options: ["Blue", "Ball", "Bird", "Boat"], a: "Blue" },
          { q: "Which word describes something (Adjective)?", options: ["Sweet", "Sugar", "Eat", "Plate"], a: "Sweet" },
          { q: "What punctuation mark goes at the end of 'Where are you going'?", options: ["?", "!", ".", ","], a: "?" }
        ]
      },

      science: {
        easy: [
          { q: "Which part of your body do you use to SEE?", options: ["Eyes", "Ears", "Nose", "Hands"], a: "Eyes" },
          { q: "What does a plant need to grow?", options: ["Water & Sunlight", "Juice & Milk", "Candy", "Ice cream"], a: "Water & Sunlight" },
          { q: "Which animal gives us milk?", options: ["Cow", "Lion", "Tiger", "Eagle"], a: "Cow" },
          { q: "The Sun gives us light and...?", options: ["Heat", "Ice", "Water", "Wind"], a: "Heat" },
          { q: "Where do fish live?", options: ["In water", "On trees", "In air", "In underground caves"], a: "In water" },
          { q: "How many legs does a dog have?", options: ["4", "2", "6", "8"], a: "4" }
        ],
        medium: [
          { q: "Which sense organ helps us TASTE food?", options: ["Tongue", "Nose", "Skin", "Eyes"], a: "Tongue" },
          { q: "Which animal is known as the 'King of the Jungle'?", options: ["Lion", "Elephant", "Monkey", "Fox"], a: "Lion" },
          { q: "Which part of a plant is under the ground?", options: ["Roots", "Leaves", "Flowers", "Stem"], a: "Roots" },
          { q: "Which is a domestic (pet) animal?", options: ["Cat", "Bear", "Zebra", "Wolf"], a: "Cat" },
          { q: "Which bird cannot fly high and swims well?", options: ["Penguin", "Parrot", "Crow", "Sparrow"], a: "Penguin" },
          { q: "What color are most plant leaves?", options: ["Green", "Blue", "Pink", "Black"], a: "Green" }
        ],
        hard: [
          { q: "Which animal lays eggs?", options: ["Hen", "Cow", "Dog", "Cat"], a: "Hen" },
          { q: "What makes day and night on Earth?", options: ["Earth spinning (rotating)", "The Moon sleeping", "Clouds moving", "Wind blowing"], a: "Earth spinning (rotating)" },
          { q: "Which of these is a living thing?", options: ["Tree", "Toy car", "Rock", "Pencil"], a: "Tree" },
          { q: "Frogs can live both on land and in...?", options: ["Water", "Space", "Trees only", "Fire"], a: "Water" },
          { q: "Which meal do we eat in the morning?", options: ["Breakfast", "Lunch", "Dinner", "Snack"], a: "Breakfast" }
        ]
      }
    };

    // State Variables
    let selectedSubject = 'math';
    let selectedLevel = 'easy';
    let activeQuestions = [];
    let currentIndex = 0;
    let currentScore = 0;
    const TOTAL_QUESTIONS_PER_ROUND = 5;

    // Helper: Shuffle Array (Fisher-Yates)
    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function setSubject(sub) {
      selectedSubject = sub;
      document.querySelectorAll('#subject-group .pill-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.subject === sub);
      });
    }

    function setLevel(lvl) {
      selectedLevel = lvl;
      document.querySelectorAll('#difficulty-group .pill-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.level === lvl);
      });
    }

    function startQuiz() {
      currentScore = 0;
      currentIndex = 0;

      // Select and shuffle questions
      const pool = questionsDatabase[selectedSubject][selectedLevel];
      const randomSubset = shuffle(pool).slice(0, Math.min(TOTAL_QUESTIONS_PER_ROUND, pool.length));

      // Shuffle options for each question
      activeQuestions = randomSubset.map(item => ({
        question: item.q,
        options: shuffle(item.options),
        correctAnswer: item.a
      }));

      // Switch screens
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');

      const subjectBadge = document.getElementById('subject-badge');
      subjectBadge.textContent = `${selectedSubject.toUpperCase()} (${selectedLevel.toUpperCase()})`;

      showQuestion();
    }

    function showQuestion() {
      const q = activeQuestions[currentIndex];
      
      document.getElementById('q-counter').textContent = `Question ${currentIndex + 1}/${activeQuestions.length}`;
      document.getElementById('score-counter').textContent = `Score: ${currentScore} ⭐`;
      document.getElementById('question-text').textContent = q.question;

      const optionsBox = document.getElementById('options-box');
      optionsBox.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(opt);
        optionsBox.appendChild(btn);
      });

      document.getElementById('feedback').className = 'feedback hidden';
      document.getElementById('next-btn').classList.add('hidden');
    }

    function checkAnswer(chosen) {
      const q = activeQuestions[currentIndex];
      const buttons = document.querySelectorAll('.option-btn');
      const feedback = document.getElementById('feedback');
      const isCorrect = chosen === q.correctAnswer;

      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === q.correctAnswer) {
          btn.classList.add('correct');
        } else if (btn.textContent === chosen) {
          btn.classList.add('incorrect');
        }
      });

      if (isCorrect) {
        currentScore++;
        feedback.textContent = "🌟 Wonderful! You got it right!";
        feedback.className = "feedback correct";
      } else {
        feedback.textContent = `Oops! The correct answer is "${q.correctAnswer}".`;
        feedback.className = "feedback incorrect";
      }

      feedback.classList.remove('hidden');
      document.getElementById('score-counter').textContent = `Score: ${currentScore} ⭐`;

      const nextBtn = document.getElementById('next-btn');
      nextBtn.textContent = (currentIndex + 1 < activeQuestions.length) ? "Next Question ➡️" : "Show My Score 🏆";
      nextBtn.classList.remove('hidden');
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < activeQuestions.length) {
        showQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      document.getElementById('final-score').textContent = `${currentScore} / ${activeQuestions.length}`;
      
      const starMsg = document.getElementById('star-message');
      if (currentScore === activeQuestions.length) {
        starMsg.textContent = "⭐⭐⭐ Super Star! Perfect Score!";
      } else if (currentScore >= 3) {
        starMsg.textContent = "⭐⭐ Great Effort! Almost there!";
      } else {
        starMsg.textContent = "⭐ Nice Try! Practice makes perfect!";
      }
    }

    function goHome() {
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('setup-screen').classList.remove('hidden');
    }
  </script>
</body>
</html>
