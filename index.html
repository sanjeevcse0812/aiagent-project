<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kids Fun Learning Quiz: Class 1, 2 & 3</title>
  <style>
    :root {
      --bg: #fdf6e2;
      --card: #ffffff;
      --primary: #ff6b6b;
      --primary-hover: #fa5252;
      --math-color: #1971c2;
      --math-bg: #e7f5ff;
      --eng-color: #e67700;
      --eng-bg: #fff9db;
      --sci-color: #2b8a3e;
      --sci-bg: #ebfbee;
      --text: #2d3748;
      --muted: #718096;
      --correct: #40c057;
      --wrong: #fa5252;
      --border: #f1e3c8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .quiz-card {
      background: var(--card);
      border-radius: 24px;
      padding: 24px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
      border: 4px solid var(--border);
      text-align: center;
      position: relative;
    }

    .hidden {
      display: none !important;
    }

    /* Top Bar with Home Button */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .btn-home {
      background: #f1f3f5;
      border: 2px solid #ced4da;
      border-radius: 12px;
      padding: 6px 14px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #495057;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-home:hover {
      background: #e9ecef;
      transform: scale(1.05);
    }

    h1 {
      font-size: 1.8rem;
      color: #e8590c;
      margin-bottom: 6px;
    }

    p.tagline {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 18px;
    }

    /* Setup Filters */
    .section-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: #495057;
      margin: 14px 0 8px;
    }

    .pill-group {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .pill-btn {
      border: 3px solid transparent;
      padding: 9px 16px;
      font-size: 0.95rem;
      border-radius: 999px;
      cursor: pointer;
      font-weight: bold;
      background: #f1f3f5;
      color: #495057;
      transition: all 0.2s ease;
    }

    .pill-btn:hover {
      transform: scale(1.03);
    }

    /* Pill Selection States */
    .pill-btn.selected {
      border-color: #2b8a3e;
      background: #d3f9d8;
      color: #2b8a3e;
    }

    .pill-btn[data-class].selected {
      border-color: #7950f2;
      background: #f3f0ff;
      color: #7950f2;
    }

    .pill-btn[data-subject="math"].selected {
      background: var(--math-bg);
      border-color: var(--math-color);
      color: var(--math-color);
    }

    .pill-btn[data-subject="english"].selected {
      background: var(--eng-bg);
      border-color: var(--eng-color);
      color: var(--eng-color);
    }

    .pill-btn[data-subject="science"].selected {
      background: var(--sci-bg);
      border-color: var(--sci-color);
      color: var(--sci-color);
    }

    /* Action Buttons */
    .btn-start {
      background: var(--primary);
      color: #fff;
      font-size: 1.2rem;
      border: none;
      border-radius: 16px;
      padding: 14px 28px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
      box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
      transition: 0.2s;
    }

    .btn-start:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    /* Quiz Header */
    .quiz-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      background: #e9ecef;
      color: #495057;
    }

    /* Questions & Options */
    .question-box {
      font-size: 1.25rem;
      font-weight: bold;
      color: #212529;
      margin: 18px 0;
      line-height: 1.4;
      min-height: 55px;
    }

    .options-list {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    .option-btn {
      background: #f8f9fa;
      border: 3px solid #dee2e6;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: bold;
      color: #343a40;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      background: #f1f3f5;
      border-color: #adb5bd;
    }

    .option-btn.correct {
      background: #d3f9d8 !important;
      border-color: var(--correct) !important;
      color: #2b8a3e !important;
    }

    .option-btn.incorrect {
      background: #ffe3e3 !important;
      border-color: var(--wrong) !important;
      color: #c92a2a !important;
    }

    /* Feedback Box */
    .feedback {
      font-size: 1rem;
      font-weight: bold;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .feedback.correct {
      background: #ebfbee;
      color: #2b8a3e;
    }

    .feedback.incorrect {
      background: #fff5f5;
      color: #c92a2a;
    }

    .btn-next {
      background: #4dabf7;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
    }

    .btn-next:hover {
      background: #339af0;
    }

    .score-banner {
      font-size: 3rem;
      font-weight: bold;
      color: #e8590c;
      margin: 15px 0;
    }
  </style>
</head>
<body>

  <div class="quiz-card">
    <div class="top-nav">
      <button class="btn-home" onclick="goHome()">🏠 Home</button>
      <span id="nav-info" style="font-size: 0.85rem; color: var(--muted);">Fun Learning Quiz</span>
    </div>

    <div id="setup-screen">
      <h1>⭐ Kids School Quiz ⭐</h1>
      <p class="tagline">Pick your grade, subject, and challenge level!</p>

      <div class="section-title">1. Choose Class</div>
      <div class="pill-group" id="class-group">
        <button class="pill-btn selected" data-class="class1" onclick="setClassLevel('class1')">🎒 Class 1</button>
        <button class="pill-btn" data-class="class2" onclick="setClassLevel('class2')">📘 Class 2</button>
        <button class="pill-btn" data-class="class3" onclick="setClassLevel('class3')">🎓 Class 3</button>
      </div>

      <div class="section-title">2. Choose Subject</div>
      <div class="pill-group" id="subject-group">
        <button class="pill-btn selected" data-subject="math" onclick="setSubject('math')">🔢 Math</button>
        <button class="pill-btn" data-subject="english" onclick="setSubject('english')">📖 English</button>
        <button class="pill-btn" data-subject="science" onclick="setSubject('science')">🌱 Science</button>
      </div>

      <div class="section-title">3. Choose Difficulty</div>
      <div class="pill-group" id="difficulty-group">
        <button class="pill-btn selected" data-level="easy" onclick="setDifficulty('easy')">🟢 Easy</button>
        <button class="pill-btn" data-level="medium" onclick="setDifficulty('medium')">🟡 Medium</button>
        <button class="pill-btn" data-level="hard" onclick="setDifficulty('hard')">🔴 Hard</button>
      </div>

      <button class="btn-start" onclick="startQuiz()">Start Playing 🚀</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="quiz-bar">
        <span id="badge-info" class="badge">Class 1 • Math • Easy</span>
        <span id="q-counter">Question 1/5</span>
        <span id="score-counter">Score: 0 ⭐</span>
      </div>

      <div id="question-text" class="question-box">Loading...</div>
      <div id="options-box" class="options-list"></div>

      <div id="feedback" class="feedback hidden"></div>
      <button id="next-btn" class="btn-next hidden" onclick="nextQuestion()">Next Question ➡️</button>
    </div>

    <div id="result-screen" class="hidden">
      <h1>🎉 Super Work! 🎉</h1>
      <p class="tagline">Here is your final quiz score:</p>
      <div id="final-score" class="score-banner">0 / 5</div>
      <p id="star-message" style="margin-bottom: 20px; font-weight: bold;"></p>
      
      <button class="btn-start" onclick="startQuiz()">Play Again 🔄</button>
      <button class="pill-btn" style="margin-top: 12px; width: 100%;" onclick="goHome()">Back to Home 🏠</button>
    </div>
  </div>

        science: {
          easy: [
            { q: "Which planet is known as the 'Red Planet'?", options: ["Mars", "Jupiter", "Venus", "Saturn"], a: "Mars" },
            { q: "Animals that eat both plants and meat are called:", options: ["Omnivores", "Carnivores", "Herbivores", "Parasites"], a: "Omnivores" },
            { q: "Which force pulls objects down toward Earth?", options: ["Gravity", "Magnetism", "Friction", "Pressure"], a: "Gravity" }
          ],
          medium: [
            { q: "Which gas do plants absorb during photosynthesis?", options: ["Carbon Dioxide", "Oxygen", "Nitrogen", "Hydrogen"], a: "Carbon Dioxide" },
            { q: "What is the boiling point of pure water?", options: ["100°C", "50°C", "0°C", "212°C"], a: "100°C" },
            { q: "Which mineral makes our bones and teeth strong?", options: ["Calcium", "Iron", "Sodium", "Potassium"], a: "Calcium" },
            { q: "The process by which plants make food is called:", options: ["Photosynthesis", "Germination", "Digestion", "Respiration"], a: "Photosynthesis" }
          ],
          hard: [
            { q: "Which layer of the atmosphere protects us from harmful UV rays?", options: ["Ozone layer", "Troposphere", "Ionosphere", "Mesosphere"], a: "Ozone layer" },
            { q: "What type of simple machine is a seesaw?", options: ["Lever", "Pulley", "Inclined plane", "Screw"], a: "Lever" },
            { q: "Which blood cells help fight infections and diseases?", options: ["White Blood Cells", "Red Blood Cells", "Platelets", "Plasma"], a: "White Blood Cells" },
            { q: "How long does the Earth take to revolve around the Sun?", options: ["365 1/4 days", "24 hours", "30 days", "12 months and 10 days"], a: "365 1/4 days" }
          ]
        }
      }
    };

    // State
    let selectedClass = 'class1';
    let selectedSubject = 'math';
    let selectedLevel = 'easy';
    let activeQuestions = [];
    let currentIndex = 0;
    let currentScore = 0;
    const QUESTIONS_PER_ROUND = 5;

    // Helper: Fisher-Yates Array Shuffle
    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function setClassLevel(cls) {
      selectedClass = cls;
      document.querySelectorAll('#class-group .pill-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.class === cls);
      });
    }

    function setSubject(sub) {
      selectedSubject = sub;
      document.querySelectorAll('#subject-group .pill-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.subject === sub);
      });
    }

    function setDifficulty(lvl) {
      selectedLevel = lvl;
      document.querySelectorAll('#difficulty-group .pill-btn').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.level === lvl);
      });
    }

    function startQuiz() {
      currentScore = 0;
      currentIndex = 0;

      // Extract question bank for the selected Class, Subject, and Level
      const pool = quizDatabase[selectedClass][selectedSubject][selectedLevel];
      const randomSubset = shuffle(pool).slice(0, Math.min(QUESTIONS_PER_ROUND, pool.length));

      activeQuestions = randomSubset.map(item => ({
        question: item.q,
        options: shuffle(item.options),
        correctAnswer: item.a
      }));

      // Switch views
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');

      const classNames = { class1: "Class 1", class2: "Class 2", class3: "Class 3" };
      document.getElementById('badge-info').textContent = `${classNames[selectedClass]} • ${selectedSubject.toUpperCase()} • ${selectedLevel.toUpperCase()}`;
      document.getElementById('nav-info').textContent = `${classNames[selectedClass]} Active`;

      showQuestion();
    }

    function showQuestion() {
      const q = activeQuestions[currentIndex];
      
      document.getElementById('q-counter').textContent = `Question ${currentIndex + 1}/${activeQuestions.length}`;
      document.getElementById('score-counter').textContent = `Score: ${currentScore} ⭐`;
      document.getElementById('question-text').textContent = q.question;

      const optionsBox = document.getElementById('options-box');
      optionsBox.innerHTML = '';

      q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(opt);
        optionsBox.appendChild(btn);
      });

      document.getElementById('feedback').className = 'feedback hidden';
      document.getElementById('next-btn').classList.add('hidden');
    }

    function checkAnswer(chosen) {
      const q = activeQuestions[currentIndex];
      const buttons = document.querySelectorAll('.option-btn');
      const feedback = document.getElementById('feedback');
      const isCorrect = chosen === q.correctAnswer;

      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === q.correctAnswer) {
          btn.classList.add('correct');
        } else if (btn.textContent === chosen) {
          btn.classList.add('incorrect');
        }
      });

      if (isCorrect) {
        currentScore++;
        feedback.textContent = "🌟 Fantastic! Correct answer!";
        feedback.className = "feedback correct";
      } else {
        feedback.textContent = `Oops! The right answer is: "${q.correctAnswer}".`;
        feedback.className = "feedback incorrect";
      }

      feedback.classList.remove('hidden');
      document.getElementById('score-counter').textContent = `Score: ${currentScore} ⭐`;

      const nextBtn = document.getElementById('next-btn');
      nextBtn.textContent = (currentIndex + 1 < activeQuestions.length) ? "Next Question ➡️" : "Show Final Results 🏆";
      nextBtn.classList.remove('hidden');
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < activeQuestions.length) {
        showQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      document.getElementById('final-score').textContent = `${currentScore} / ${activeQuestions.length}`;
      
      const starMsg = document.getElementById('star-message');
      if (currentScore === activeQuestions.length) {
        starMsg.textContent = "⭐⭐⭐ Amazing! Perfect Score!";
      } else if (currentScore >= 3) {
        starMsg.textContent = "⭐⭐ Great Job! Well done!";
      } else {
        starMsg.textContent = "⭐ Nice Attempt! Keep learning!";
      }
    }

    function goHome() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('setup-screen').classList.remove('hidden');
      document.getElementById('nav-info').textContent = "Fun Learning Quiz";
    }
  </script>
</body>
</html>
